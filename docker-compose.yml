version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: clouddrive_postgres
    environment:
      POSTGRES_DB: clouddrivedb
      POSTGRES_USER: clouddrive
      POSTGRES_PASSWORD: clouddrive_secret
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U clouddrive -d clouddrivedb"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: clouddrive_pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@clouddrive.com
      PGADMIN_DEFAULT_PASSWORD: admin123
    ports:
      - "5050:80"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
